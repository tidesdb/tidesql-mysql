name: MySQL TideSQL Storage Engine Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Pinned build versions, the single place to move from one release to the next.
# TIDESDB_REF is a ref on tidesdb/tidesdb, MYSQL_VERSION a tag on
# mysql/mysql-server.  Bump them together to retarget the whole matrix.
#
# NOTE: TIDESDB_REF is a BRANCH, not a tag.  The library's v10 line is not
# tagged yet -- its newest tag is v9.3.15, and 10.0.0 and 10.0.1 exist only as
# branches -- so this pin moves under CI and a run is not reproducible from the
# ref alone.  Each job prints the commit the branch resolved to for that reason.
# Make this a tag once v10.0.1 is tagged.
env:
  TIDESDB_REF: "10.0.1"
  MYSQL_VERSION: "mysql-9.7.0"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both macOS architectures, on the image whose default toolchain the
        # server actually builds with.  macos-latest is macOS 26, whose Xcode 26
        # libc++ no longer provides std::is_trivial_v -- a trait MySQL's own
        # libs/mysql/gtid/tag_plain.h static_asserts on at C++23, so the server
        # fails to compile there and no change to this plugin can help.  macos-15
        # defaults to Xcode 16 and is selected explicitly below.
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-2022]

    steps:
      # Two things the Windows checkout would otherwise do to the working tree, both
      # of which have to be settled before anything is cloned.
      #
      # Symlinks: nothing in the tree is one today, so this changes nothing now.  It
      # is set because a Windows checkout turns a symlink into a text file holding its
      # target path, and a suite file that silently became a one-line text stub would
      # be read as the test failing rather than as the checkout being wrong.
      #
      # Line endings: the runner defaults core.autocrlf to true, so every file git
      # considers text arrives CRLF.  Neither this repository nor mysql-server asks for
      # that in .gitattributes, and mysql-test is not written for it -- mtr rejects
      # mysql-test/collections/disabled.def because a blank line carrying a lone \r is
      # not blank to its parser, and .result files compared byte for byte against
      # server output would differ on every line.  Turning it off is what makes the
      # Windows tree identical to the one the other platforms test.
      - name: Keep the checkout byte-identical to Unix (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout TideSQL
        uses: actions/checkout@v4
        with:
          path: tidesql

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git bison ccache pkg-config \
            libssl-dev libncurses-dev libudev-dev libcurl4-openssl-dev libtirpc-dev \
            liblz4-dev libzstd-dev libsnappy-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja bison openssl@3 lz4 zstd snappy ccache curl
          # macOS ships bison 2.3; the server's parser needs 3.x, so the keg-only
          # one has to come first on PATH for the whole job.
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Select a toolchain the server compiles with (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          # The image carries Xcode 26 alongside 16, and 26's libc++ dropped
          # std::is_trivial_v.  Pick the newest Xcode 16 rather than inheriting
          # whatever the image happens to default to, so a default bump does not
          # silently break the build.  Falls through to the default if none is
          # installed, and prints what it chose either way.
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${XC:-}" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          c++ --version

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y winflexbison3 ninja
          vcpkg install zstd:x64-windows lz4:x64-windows snappy:x64-windows openssl:x64-windows

      # The Unix jobs cache ccache; this is the same idea for MSVC.  It hooks in through
      # CMAKE_<LANG>_COMPILER_LAUNCHER, which Ninja honours and MSBuild does not, so it
      # only works alongside the Ninja generator the build step uses.
      - name: Set up sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure ccache (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "/usr/lib/ccache:/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Cache ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-${{ env.MYSQL_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ env.MYSQL_VERSION }}-

      - name: Cache the TidesDB library build
        id: tidesdb-cache
        uses: actions/cache@v4
        with:
          path: tidesdb-install
          key: tidesdb-${{ matrix.os }}-${{ env.TIDESDB_REF }}-${{ github.run_id }}

      - name: Build and install the TidesDB library
        shell: bash
        run: |
          set -euo pipefail
          # The plugin links libtidesdb and its build skips itself entirely when it
          # cannot find it, so this has to succeed before the server is configured.
          #
          # TIDESDB_BUILD_TESTS defaults to ON.  Nothing here runs the library's own
          # tests, and on Windows each test executable carries a vcpkg z-applocal
          # post-build step that copies its dll dependencies -- which is where this
          # build was failing.  Turning them off removes the failing step and the
          # time it costs on every platform.
          if [ ! -d tidesdb-install ]; then
            git clone --depth 1 --branch "${TIDESDB_REF}" \
              https://github.com/tidesdb/tidesdb.git tidesdb-src
            # record what the branch actually resolved to, so a failing run can be
            # tied back to a commit even though the ref itself moves
            git -C tidesdb-src rev-parse HEAD
            # Every allocator option defaults to OFF, so this links the system
            # allocator and the plugin needs no LD_PRELOAD to load.  A build that
            # turns jemalloc/mimalloc/tcmalloc on would -- see
            # doc/01-getting-started/install.md.
            # The compression backends come from vcpkg on Windows, and the library
            # locates them with find_package -- which only sees them through the
            # vcpkg toolchain file.  Visual Studio is also a multi-config generator,
            # so build and install have to name the configuration explicitly or they
            # default to Debug and the install finds nothing.
            # Written as two whole commands rather than one with array-built flags:
            # macOS runners still ship bash 3.2, where expanding an empty array under
            # set -u aborts the step.
            if [ "$RUNNER_OS" = "Windows" ]; then
              cmake -S tidesdb-src -B tidesdb-build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PWD/tidesdb-install" -DTIDESDB_BUILD_TESTS=OFF \
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_TARGET_TRIPLET=x64-windows
              cmake --build tidesdb-build --parallel --config Release
              cmake --install tidesdb-build --config Release
            else
              cmake -S tidesdb-src -B tidesdb-build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PWD/tidesdb-install" -DTIDESDB_BUILD_TESTS=OFF
              cmake --build tidesdb-build --parallel
              cmake --install tidesdb-build
            fi
          fi
          echo "TIDESDB_ROOT=$PWD/tidesdb-install" >> "$GITHUB_ENV"

      - name: Clone the MySQL server
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if git clone --depth 1 --branch "$MYSQL_VERSION" \
                 https://github.com/mysql/mysql-server.git mysql-server; then
              exit 0
            fi
            echo "clone attempt $i failed, retrying in 10s"
            rm -rf mysql-server
            sleep 10
          done
          echo "could not clone mysql-server at $MYSQL_VERSION"
          exit 1

      - name: Copy the storage engine into the server tree
        shell: bash
        run: cp -R tidesql/tidesdb mysql-server/storage/tidesdb

      # MySQL's mtr resolves a suite name only against mysql-test/suite,
      # plugin/<suite>/tests and a few internal/ paths -- it does not search
      # storage/<engine>/mysql-test the way some other servers do.  Left out, the
      # build is green and nothing is tested, so both suites are placed where mtr
      # looks and the copy is checked.
      - name: Install the test suites where mtr looks for them
        shell: bash
        run: |
          set -euo pipefail
          src=tidesql/tidesdb/mysql-test
          dst=mysql-server/mysql-test/suite
          mkdir -p "$dst"
          for suite in tidesdb tidesdb_rpl; do
            rm -rf "$dst/$suite"
            cp -R "$src/$suite" "$dst/$suite"
          done
          echo "tidesdb: $(ls "$dst"/tidesdb/t/*.test | wc -l) tests"
          echo "tidesdb_rpl: $(ls "$dst"/tidesdb_rpl/t/*.test | wc -l) tests"

      - name: Configure and build the server (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="-DWITH_SSL=$(brew --prefix openssl@3)"
          fi
          # Boost ships vendored in the server tree, so nothing is downloaded.
          cmake -S mysql-server -B mysql-server/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWITH_BOOST="$PWD/mysql-server/extra/boost" \
            -DWITH_UNIT_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            $EXTRA
          cmake --build mysql-server/build --parallel 2>&1 | tee build.log

      - name: Configure and build the server (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # WITH_SSL defaults to system on Windows and the runner ships no OpenSSL laid out the
          # way the server expects, down to applink.c, so it has to be pointed at one.
          #
          # It must be a prefix holding OpenSSL and nothing else.  ssl.cmake ends with
          #   INCLUDE_DIRECTORIES(BEFORE SYSTEM ${OPENSSL_INCLUDE_DIR})
          # -- global, and ahead of everything -- so naming vcpkg's shared installed/x64-windows
          # tree would put vcpkg's zstd.h, lz4.h and snappy.h in front of the bundled copies for
          # every target in the build.  mysys then compiles against vcpkg's zstd.h, which declares
          # the API dllimport, while still linking the bundled static zstd, and libmysql fails on
          # unresolved __imp_ZSTD_* symbols.  So OpenSSL is copied out into a prefix of its own.
          #
          # For the same reason there is no vcpkg toolchain file here: the server bundles zstd,
          # lz4, icu and protobuf and links its own.  Only the TidesDB library build needs vcpkg.
          SSLDIR="$PWD/openssl-prefix"
          VCPKGDIR="$VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          mkdir -p "$SSLDIR/include" "$SSLDIR/lib" "$SSLDIR/bin"
          cp -R "$VCPKGDIR/include/openssl" "$SSLDIR/include/"
          cp "$VCPKGDIR"/lib/libssl.lib "$VCPKGDIR"/lib/libcrypto.lib "$SSLDIR/lib/"
          cp "$VCPKGDIR"/bin/libssl*.dll "$VCPKGDIR"/bin/libcrypto*.dll "$SSLDIR/bin/"
          test -f "$SSLDIR/include/openssl/applink.c" \
            || { echo "applink.c missing from the OpenSSL prefix"; exit 1; }
          echo "SSLDIR=$SSLDIR" >> "$GITHUB_ENV"

          # Ninja rather than the Visual Studio generator, which is what sccache needs:
          # it hooks in through CMAKE_<LANG>_COMPILER_LAUNCHER, and MSBuild does not
          # honour that.  Ninja needs the MSVC environment, which this shell does not
          # have, so vcvars is run and the environment it produces is imported.
          #
          # vswhere reports where Visual Studio actually is, rather than this guessing an
          # edition and breaking when the image changes.
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          # Both vswhere and cmd write CRLF, and a trailing \r on a path or on INCLUDE
          # and LIB breaks every compile that uses them, so it is stripped at the source.
          VSPATH="$("$VSWHERE" -latest -products '*' \
                    -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
                    -property installationPath | tr -d '\r')"
          test -n "$VSPATH" || { echo "no Visual Studio with the C++ toolchain found"; exit 1; }

          # The call goes in a batch file rather than on cmd's command line.  Inline, the
          # path has to survive quoting by bash and then MSYS's translation of arguments
          # bound for a native program, and MSYS hands the escaped quotes to cmd as
          # written -- cmd answers that '\"C:\Program Files\...\"' is not a recognised
          # command.  A file needs no quoting, and printf writes the path without bash
          # getting a second look at its backslashes.
          {
            echo '@echo off'
            printf 'call "%s\\VC\\Auxiliary\\Build\\vcvars64.bat" >nul\n' "$VSPATH"
            echo 'set'
          } > vcenv.bat
          cmd //c vcenv.bat | tr -d '\r' > vcenv.txt
          grep -qiE '^INCLUDE=' vcenv.txt \
            || { echo "vcvars produced no environment; the batch file was:"; cat vcenv.bat; exit 1; }
          # Everything except PATH can be exported as-is.  PATH cannot: vcvars writes it
          # in Windows form, and putting that into this shell's PATH loses every Unix
          # tool the rest of the job runs.  cygpath converts the list instead.
          while IFS='=' read -r key val; do
            case "$key" in
              PATH|Path|path) continue ;;
              ''|*' '*|*'('*) continue ;;
            esac
            export "$key=$val"
          done < vcenv.txt
          win_path="$(grep -iE '^PATH=' vcenv.txt | head -1 | cut -d= -f2-)"
          export PATH="$(cygpath -p "$win_path"):$PATH"
          command -v cl.exe >/dev/null || { echo "vcvars did not put cl.exe on PATH"; exit 1; }

          # Anything not built is time not spent, and none of this is used here: Router is
          # a separate program, and the three legacy engines are not what any TideSQL test
          # uses.  InnoDB stays -- the data dictionary is InnoDB tables, so the server does
          # not start without it.
          #
          # Nothing here has to arrange for the debug-information format sccache needs.
          # A separate PDB, which /Zi writes and two compilations share, is not cacheable;
          # MySQL's own cmake/os/Windows.cmake already rewrites /Zi to /Z7 for every
          # configuration, carrying the same information in each object file instead.
          cmake -S mysql-server -B mysql-server/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DWITH_BOOST="$PWD/mysql-server/extra/boost" \
            -DWITH_UNIT_TESTS=OFF \
            -DWITH_ROUTER=OFF \
            -DWITHOUT_ARCHIVE_STORAGE_ENGINE=1 \
            -DWITHOUT_BLACKHOLE_STORAGE_ENGINE=1 \
            -DWITHOUT_FEDERATED_STORAGE_ENGINE=1 \
            -DWITH_SSL="$SSLDIR"
          cmake --build mysql-server/build --parallel 2>&1 | tee build.log
          sccache --show-stats || true

      # The plugin's own CMake returns early with only a STATUS message when it
      # cannot find libtidesdb, which would otherwise leave a green build with no
      # engine in it.
      - name: Check the plugin was actually built
        shell: bash
        run: |
          set -euo pipefail
          found=$(find mysql-server/build -name 'ha_tidesdb.*' \
                    \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) | head -1)
          if [ -z "$found" ]; then
            echo "ha_tidesdb was not built -- the plugin's CMake most likely did not find libtidesdb"
            grep -i "TidesDB:" build.log | head -20 || true
            exit 1
          fi
          echo "built: $found"

      # RULES.md rule 8 is zero warnings, for this plugin rather than for the whole
      # server, so the filter keeps only diagnostics whose path is in the engine.
      #
      # D9025 is excluded because it is not a diagnostic about code.  MySQL sets
      # CMAKE_CXX_STANDARD 23, which MSVC takes as /std:c++23preview and warns about
      # overriding the /std:c++latest already on the command line.  It is emitted once
      # per compiler invocation for every target in the build -- sql_dd, sql_main and
      # innobase among them -- and naming a target's vcxproj is what puts the engine's
      # path in the line.  Failing on it would mean failing on the server's own build
      # configuration, which this gate has no business policing.
      - name: Zero-warning gate
        shell: bash
        run: |
          set -euo pipefail
          warnings=$(tr '\\' '/' < build.log \
                     | grep -i 'warning' \
                     | grep -v 'warning D9025' \
                     | grep 'storage/tidesdb/' || true)
          if [ -n "$warnings" ]; then
            echo "plugin build is not warning-clean:"
            echo "$warnings"
            exit 1
          fi
          echo "no warnings from storage/tidesdb"

      - name: Run the TideSQL test suite (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: mysql-server/build/mysql-test
        run: ./mtr --suite=tidesdb,tidesdb_rpl --parallel=4 --force --retry=1 2>&1 | tee ../../../mtr.log

      - name: Run the TideSQL test suite (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: mysql-server/build/mysql-test
        run: |
          set -euo pipefail
          # The plugin links the compression libraries as vcpkg's x64-windows triplet
          # builds them, which is to say dynamically, so zstd.dll and lz4.dll have to be
          # findable when the server loads it.  They are not linked into it: the message
          # for a missing dependency is the same errno 126 as for a missing plugin, and
          # reads as the plugin not being there at all.
          #
          # Both variables below hold Windows paths, and a Windows path cannot go into a
          # PATH this shell builds: the drive colon in "D:\a\..." is the separator, so
          # each one lands as an entry "D" and an entry "\a\..." and neither is a
          # directory.  cygpath converts them to the form this shell splits correctly,
          # and MSYS converts the whole thing back when it starts a native program.
          ws="$(cygpath -u "$GITHUB_WORKSPACE")"
          vcpkg_root="$(cygpath -u "$VCPKG_INSTALLATION_ROOT")"
          export PATH="$ws/openssl-prefix/bin:$vcpkg_root/installed/x64-windows/bin:$ws/tidesdb-install/bin:$PATH"

          # Check the files rather than trusting the paths: a dependency that is not
          # reachable fails every test with an error that names no library at all.
          vcpkg_bin="$vcpkg_root/installed/x64-windows/bin"
          test -d "$vcpkg_bin" || { echo "no vcpkg bin directory at $vcpkg_bin"; exit 1; }
          for pat in 'zstd*.dll' 'lz4*.dll'; do
            # shellcheck disable=SC2086
            match=$(ls $vcpkg_bin/$pat 2>/dev/null | head -1 || true)
            test -n "$match" || { echo "no $pat in $vcpkg_bin; the plugin will not load";
                                  ls "$vcpkg_bin"; exit 1; }
            echo "  found $(basename "$match")"
          done

          # With no --plugin-dir the server looks in <basedir>/lib/plugin, and nothing
          # puts anything there on Windows: MySQL's own CMakeLists links lib/plugin to
          # plugin_output_directory only under "IF(UNIX AND BUILD_IS_SINGLE_CONFIG)", so
          # the UNIX half excludes this even though Ninja satisfies the other half.  The
          # server is told where the plugin actually is -- the same --plugin-dir mtr
          # hands its own in-tree plugins through plugin.defs, which a third-party engine
          # cannot add itself to.
          plugin_dir="$(cd ../plugin_output_directory && pwd -W)"
          echo "plugin-dir: $plugin_dir"
          test -f "$plugin_dir/ha_tidesdb.dll"

          perl mysql-test-run.pl --suite=tidesdb,tidesdb_rpl --parallel=2 --force --retry=1 \
            --mysqld=--plugin-dir="$plugin_dir" 2>&1 | tee ../../../mtr.log

      # mtr reports success for an empty run, so a suite it failed to find would
      # otherwise pass.  The floor is deliberately loose: it catches "nothing ran",
      # not a single removed test.
      - name: Check the suite actually ran
        shell: bash
        run: |
          set -euo pipefail
          line=$(grep -E 'Completed: All [0-9]+ tests were successful' mtr.log | tail -1 || true)
          if [ -z "$line" ]; then
            echo "no success line in the mtr output"
            exit 1
          fi
          n=$(echo "$line" | grep -oE '[0-9]+' | head -1)
          echo "$n tests passed"
          if [ "$n" -lt 50 ]; then
            echo "only $n tests ran; a suite was not picked up in full"
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            build.log
            mtr.log
            mysql-server/build/mysql-test/var/log/**/*.err
            mysql-server/build/mysql-test/var/log/**/*.reject
          retention-days: 7
          if-no-files-found: ignore

  sanitizers:
    name: ASAN + UBSAN (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TideSQL
        uses: actions/checkout@v4
        with:
          path: tidesql

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git bison ccache pkg-config \
            libssl-dev libncurses-dev libudev-dev libcurl4-openssl-dev libtirpc-dev \
            liblz4-dev libzstd-dev libsnappy-dev

      - name: Configure ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --set-config=max_size=2G

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ env.MYSQL_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-asan-${{ env.MYSQL_VERSION }}-

      - name: Build and install the TidesDB library
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${TIDESDB_REF}" \
            https://github.com/tidesdb/tidesdb.git tidesdb-src
          git -C tidesdb-src rev-parse HEAD
          cmake -S tidesdb-src -B tidesdb-build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DTIDESDB_BUILD_TESTS=OFF
          cmake --build tidesdb-build --parallel
          sudo cmake --install tidesdb-build
          sudo ldconfig

      - name: Clone the MySQL server
        run: |
          git clone --depth 1 --branch "$MYSQL_VERSION" \
            https://github.com/mysql/mysql-server.git mysql-server

      - name: Copy the storage engine and the suite into the server tree
        run: |
          set -euo pipefail
          cp -R tidesql/tidesdb mysql-server/storage/tidesdb
          for suite in tidesdb tidesdb_rpl; do
            cp -R "tidesql/tidesdb/mysql-test/$suite" "mysql-server/mysql-test/suite/$suite"
          done

      # Only the plugin is instrumented; the server around it is not.  That is the
      # supported shape -- the sanitizer runtimes are preloaded so the plugin's
      # undefined __asan_*/__ubsan_* symbols resolve at dlopen, which is also what
      # proves the instrumentation is live: without the preload the plugin cannot
      # load at all and every test fails on have_tidesdb.inc.
      - name: Build the server with an instrumented plugin
        run: |
          set -euo pipefail
          cmake -S mysql-server -B mysql-server/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWITH_BOOST="$PWD/mysql-server/extra/boost" \
            -DWITH_UNIT_TESTS=OFF \
            -DTIDESDB_WITH_ASAN=ON -DTIDESDB_WITH_UBSAN=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build mysql-server/build --parallel 2>&1 | tee build.log
          # the instrumentation has to actually be in the object, not just requested
          nm -D mysql-server/build/plugin_output_directory/ha_tidesdb.so \
            | grep -c "__asan" \
            || { echo "plugin carries no ASAN symbols; it was not instrumented"; exit 1; }

      - name: Run the suite under the sanitizers
        working-directory: mysql-server/build/mysql-test
        run: |
          set -euo pipefail
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libubsan.so)"
          # The server itself is uninstrumented, so its allocations would dominate a
          # leak report; the interest here is the plugin's own memory errors.
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=0:halt_on_error=0:detect_odr_violation=0
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=0
          ./mtr --suite=tidesdb,tidesdb_rpl --parallel=2 --force --retry=0 2>&1 | tee ../../../mtr.log

      - name: Fail on any sanitizer report
        run: |
          set -euo pipefail
          pattern='ERROR: AddressSanitizer|runtime error:|SUMMARY: (Address|Undefined)'
          hits=$( { grep -hEc "$pattern" mtr.log || true; } )
          logs=$( { grep -rhE "$pattern" mysql-server/build/mysql-test/var/*/log/*.err 2>/dev/null || true; } )
          if [ "${hits:-0}" -ne 0 ] || [ -n "$logs" ]; then
            echo "sanitizer reports:"
            grep -hE "$pattern" mtr.log | head -40 || true
            echo "$logs" | head -40
            exit 1
          fi
          echo "clean: no ASAN or UBSAN reports"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-sanitizers
          path: |
            build.log
            mtr.log
            mysql-server/build/mysql-test/var/log/**/*.err
          retention-days: 7
          if-no-files-found: ignore
